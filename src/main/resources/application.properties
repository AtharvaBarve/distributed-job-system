spring.application.name=distributed-job-system
spring.datasource.url=jdbc:postgresql://localhost:5432/distributed_jobs
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

jobs.worker-count=${WORKER_COUNT:4}
jobs.max-attempts=${MAX_ATTEMPTS:3}
jobs.retry-base-delay-ms=${RETRY_BASE_DELAY_MS:1000}
jobs.recovery-interval-ms=${RECOVERY_INTERVAL_MS:5000}
jobs.recovery-timeout-ms=${RECOVERY_TIMEOUT_MS:30000}
jobs.recovery-enabled=${RECOVERY_ENABLED:true}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
